<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location DCO Creative Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #e41e2b, #ff9100, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header p {
            font-size: 13px;
            color: #8a8d9b;
            margin-top: 6px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }
        .card {
            background: #161821;
            border: 1px solid #262938;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #3f445c;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 300px;
            margin-bottom: 15px;
        }
        .brand-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .badge-coke { background: rgba(228, 30, 43, 0.15); color: #e41e2b; border: 1px solid rgba(228, 30, 43, 0.3); }
        .badge-5alive { background: rgba(255, 145, 0, 0.15); color: #ff9100; border: 1px solid rgba(255, 145, 0, 0.3); }
        .badge-schweppes { background: rgba(255, 204, 0, 0.15); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.3); }
        .card-dim {
            font-size: 11px;
            color: #666a7a;
            font-weight: 600;
        }
        iframe {
            width: 300px;
            height: 250px;
            border: none;
            border-radius: 4px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card-actions {
            margin-top: 15px;
            width: 300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            background: #252836;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #363b50;
        }
    </style>
</head>
<body>
    <header>
        <h1>Location DCO Campaign Dashboard</h1>
        <p>Interactive 300x250 HTML5 Geolocation Display Creatives</p>
    </header>

    <div class="grid">
        <!-- Coke Creative -->
        <div class="card">
            <div class="card-header">
                <span class="brand-badge badge-coke">Coca-Cola</span>
                <span class="card-dim">300x250</span>
            </div>
            <iframe src="300x250/index.html" title="Coca-Cola Banner"></iframe>
            <div class="card-actions">
                <a href="300x250/index.html" target="_blank" class="btn">Open Full Banner ↗</a>
            </div>
        </div>

        <!-- 5Alive Creative -->
        <div class="card">
            <div class="card-header">
                <span class="brand-badge badge-5alive">5Alive</span>
                <span class="card-dim">300x250</span>
            </div>
            <iframe src="5alive300x250/index.html" title="5Alive Banner"></iframe>
            <div class="card-actions">
                <a href="5alive300x250/index.html" target="_blank" class="btn">Open Full Banner ↗</a>
            </div>
        </div>

        <!-- Schweppes Creative -->
        <div class="card">
            <div class="card-header">
                <span class="brand-badge badge-schweppes">Schweppes</span>
                <span class="card-dim">300x250</span>
            </div>
            <iframe src="schweppes300x250/index.html" title="Schweppes Banner"></iframe>
            <div class="card-actions">
                <a href="schweppes300x250/index.html" target="_blank" class="btn">Open Full Banner ↗</a>
            </div>
        </div>
    </div>
</body>
</html>
